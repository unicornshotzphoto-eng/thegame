openapi: 3.0.3
info:
  title: TheGame API
  version: 0.1.0
  description: |
    Draft OpenAPI spec generated from Django URL configs, views, and
    repository docs. Note: api/quiz/urls.py and api/quiz/views.py contain
    unresolved merge conflicts, so some endpoints are listed as variants
    with x-variant annotations.
servers:
  - url: http://localhost:8000
    description: Local dev
  - url: http://192.168.1.210:8000
    description: LAN dev
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Profile
  - name: Users
  - name: Friends
  - name: Groups
  - name: Calendars
  - name: Questions
  - name: Game
  - name: Multiplayer
paths:
  /quiz/signin/:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Auth tokens and user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/signup/:
    post:
      tags: [Auth]
      summary: Sign up
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Auth tokens and user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/profile/picture/:
    post:
      tags: [Profile]
      summary: Update profile picture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                thumbnail:
                  type: string
                  format: binary
              required: [thumbnail]
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePictureResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/search/users/:
    get:
      tags: [Users]
      summary: Search users
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query for username or email
      responses:
        '200':
          description: List of matching users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/friends/request/send/:
    post:
      tags: [Friends]
      summary: Send friend request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestSendRequest'
      responses:
        '201':
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/friends/request/{request_id}/respond/:
    post:
      tags: [Friends]
      summary: Respond to friend request
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendRequestRespondRequest'
      responses:
        '200':
          description: Friend request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/friends/:
    get:
      tags: [Friends]
      summary: List friends
      responses:
        '200':
          description: Friends list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsListResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/friends/requests/:
    get:
      tags: [Friends]
      summary: List pending friend requests
      responses:
        '200':
          description: Pending friend requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRequestsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/groups/create/:
    post:
      tags: [Groups]
      summary: Create group chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChat'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/groups/:
    get:
      tags: [Groups]
      summary: List groups
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupListResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/groups/{group_id}/:
    get:
      tags: [Groups]
      summary: Get group details
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChat'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/groups/{group_id}/messages/:
    get:
      tags: [Groups]
      summary: List group messages
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMessagesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Groups]
      summary: Send group message
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMessageRequest'
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMessage'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/groups/{group_id}/add-members/:
    post:
      tags: [Groups]
      summary: Add members to group
      x-variant: head
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGroupMembersRequest'
      responses:
        '200':
          description: Members added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/groups/{group_id}/members/add/:
    post:
      tags: [Groups]
      summary: Add members to group
      x-variant: main
      deprecated: true
      parameters:
        - in: path
          name: group_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGroupMembersRequest'
      responses:
        '200':
          description: Members added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/calendars/:
    get:
      tags: [Calendars]
      summary: List shared calendars
      x-variant: head
      responses:
        '200':
          description: Calendar list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarListResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Calendars]
      summary: Create shared calendar
      x-variant: head
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarRequest'
      responses:
        '201':
          description: Calendar created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarCreateResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/calendars/{calendar_id}/:
    get:
      tags: [Calendars]
      summary: Get calendar detail
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Calendar detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarDetailResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/calendars/{calendar_id}/invite/:
    post:
      tags: [Calendars]
      summary: Invite friends to calendar
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarInviteRequest'
      responses:
        '200':
          description: Invitations sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/calendars/{calendar_id}/events/:
    get:
      tags: [Calendars]
      summary: List calendar events
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Calendars]
      summary: Create calendar event
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/calendars/{calendar_id}/events/{event_id}/:
    get:
      tags: [Calendars]
      summary: Get calendar event
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Calendars]
      summary: Update calendar event
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEventResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Calendars]
      summary: Delete calendar event
      x-variant: head
      parameters:
        - in: path
          name: calendar_id
          required: true
          schema:
            type: integer
        - in: path
          name: event_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/categories/:
    get:
      tags: [Questions]
      summary: List question categories
      security: []
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionCategoryListResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/random/:
    get:
      tags: [Questions]
      summary: Random question (any category)
      security: []
      responses:
        '200':
          description: Random question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/random/{category}/:
    get:
      tags: [Questions]
      summary: Random question by category
      security: []
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Random question
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/{category}/:
    get:
      tags: [Questions]
      summary: List questions by category
      security: []
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Question'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/:
    get:
      tags: [Questions]
      summary: List categories or questions (variant)
      description: |
        Head variant returns {categories: []}. Main variant expects query
        param `category` and returns {questions: []}.
      security: []
      x-variant: head-and-main
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Category identifier (main variant)
      responses:
        '200':
          description: Categories or questions
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/QuestionCategoryListResponse'
                  - $ref: '#/components/schemas/QuestionListResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/{question_id}/:
    get:
      tags: [Questions]
      summary: Get question detail
      x-variant: main
      parameters:
        - in: path
          name: question_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Question detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/answer/:
    post:
      tags: [Questions]
      summary: Submit a question response
      x-variant: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuestionResponseRequest'
      responses:
        '201':
          description: Response created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/questions/responses/:
    get:
      tags: [Questions]
      summary: List responses for current user
      x-variant: main
      responses:
        '200':
          description: Response list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionResponsesResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/create/:
    post:
      tags: [Multiplayer]
      summary: Create multiplayer game (legacy)
      x-variant: head
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreateRequestLegacy'
      responses:
        '201':
          description: Game session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionLegacy'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/:
    get:
      tags: [Multiplayer]
      summary: List multiplayer games (legacy)
      x-variant: head
      responses:
        '200':
          description: Game list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionListResponseLegacy'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/{game_id}/:
    get:
      tags: [Multiplayer]
      summary: Get multiplayer game details (legacy)
      x-variant: head
      parameters:
        - in: path
          name: game_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Game session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionLegacy'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/{game_id}/start-round/:
    post:
      tags: [Multiplayer]
      summary: Start round (legacy)
      x-variant: head
      parameters:
        - in: path
          name: game_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRoundRequest'
      responses:
        '200':
          description: Game session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionLegacy'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/{game_id}/submit-answer/:
    post:
      tags: [Multiplayer]
      summary: Submit answer (legacy)
      x-variant: head
      parameters:
        - in: path
          name: game_id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLegacyAnswerRequest'
      responses:
        '201':
          description: Answer accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/{game_id}/answers/:
    get:
      tags: [Multiplayer]
      summary: List answers for current question (legacy)
      x-variant: head
      parameters:
        - in: path
          name: game_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Answers list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAnswersResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/{game_id}/next-round/:
    post:
      tags: [Multiplayer]
      summary: Advance to next round (legacy)
      x-variant: head
      parameters:
        - in: path
          name: game_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Game session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionLegacy'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/games/{game_id}/end/:
    post:
      tags: [Multiplayer]
      summary: End game (legacy)
      x-variant: head
      parameters:
        - in: path
          name: game_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Game session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionLegacy'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/game/create/:
    post:
      tags: [Game]
      summary: Create session-based game
      x-variant: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreateRequestTurnBased'
      responses:
        '201':
          description: Game session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSessionTurnBased'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/game/{session_id}/:
    get:
      tags: [Game]
      summary: Get session details
      x-variant: main
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/game/{session_id}/delete/:
    delete:
      tags: [Game]
      summary: Delete session
      x-variant: main
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/game/random-question/:
    post:
      tags: [Game]
      summary: Create round with random question
      x-variant: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RandomQuestionRequestTurnBased'
      responses:
        '200':
          description: Round created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RandomQuestionResponseTurnBased'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/game/answer/:
    post:
      tags: [Game]
      summary: Submit answer for round
      x-variant: main
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitGameAnswerRequestTurnBased'
      responses:
        '200':
          description: Answer saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitGameAnswerResponseTurnBased'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /quiz/game/active/:
    get:
      tags: [Game]
      summary: List active sessions
      x-variant: main
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSessionsResponse'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
